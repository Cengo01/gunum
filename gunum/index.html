<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#0b1220"><title>Günüm</title><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-180.png"><meta name="apple-mobile-web-app-title" content="Günüm"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--bg:#0b1220;--c:#13203a;--t:#f3ead7;--m:#9aa5b8;--g:#d4af37;--a:#1d5a43;--l:#223356;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);height:100%}
:root[data-theme=light]{--bg:#f6f0e1;--c:#fffaf0;--t:#1b2a22;--m:#6b6a5e;--g:#9c7a22;--a:#1f4d3a;--l:#e4dcc5}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--t);font:16px/1.4 -apple-system,system-ui,sans-serif;overflow-x:hidden}
#app{display:flex;flex-direction:column;height:100%}main{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 14px 90px;animation:f .3s}@keyframes f{from{opacity:0;transform:translateY(6px)}}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--c);border-top:1px solid var(--l);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;color:var(--m);padding:10px 0;font-size:11px;min-height:50px}nav button b{display:block;font-size:20px;font-weight:400}nav .on{color:var(--g)}
.card{background:var(--c);border:1px solid var(--l);border-radius:18px;padding:14px;margin-bottom:12px}h2{margin:4px 0 10px;font-size:18px;color:var(--g)}
.clock{font-size:54px;font-weight:200;letter-spacing:2px;text-align:center}.sub{color:var(--m);text-align:center}
button,input,select,textarea{font:inherit;color:var(--t)}input,select,textarea{background:var(--bg);border:1px solid var(--l);border-radius:12px;padding:10px;width:100%;margin:4px 0}
.btn{background:var(--a);color:#fff;border:0;border-radius:12px;padding:10px 14px;min-height:44px}.btn.g{background:var(--g);color:#111}.btn.o{background:none;border:1px solid var(--l);color:var(--t)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:0 1 auto}.sp{flex:1!important}.small{font-size:13px;color:var(--m)}
.it{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--l)}.it:last-child{border:0}.done .tt{text-decoration:line-through;opacity:.5}
.chip{border:1px solid var(--l);border-radius:20px;padding:6px 10px;background:none;min-height:36px}.chip.on{background:var(--g);color:#111;border-color:var(--g)}
.bar{height:8px;background:var(--l);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g)}
#md{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;z-index:5}#md>div{background:var(--bg);width:100%;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
#tm{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:10px;right:10px;z-index:9}.tn{background:var(--g);color:#111;border-radius:14px;padding:12px;margin-bottom:6px}
.me{background:var(--a);color:#fff;margin-left:30px}.bt{background:var(--l);margin-right:30px}.bb{border-radius:14px;padding:9px 12px;margin:6px 0;white-space:pre-wrap}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:center;padding:4px}
</style></head><body><div id="tm"></div><div id="app"><main id="v"></main><nav id="nv"></nav></div><div id="md" onclick="if(event.target==this)cm()"><div id="mb"></div></div>
<script>
const K='gunum1',p=n=>String(n).padStart(2,'0'),ymd=d=>d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()),hm=d=>p(d.getHours())+':'+p(d.getMinutes());
const DN=['Paz','Pzt','Sal','Çar','Per','Cum','Cmt'],DF=['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'],CATS=['Okul','İş','İbadet','Kişisel gelişim','Spor','Diğer'];
const PK=[['Fajr','İmsak'],['Sunrise','Güneş'],['Dhuhr','Öğle'],['Asr','İkindi'],['Maghrib','Akşam'],['Isha','Yatsı']];
const H=[["Ameller niyetlere göredir.","Buhârî, Bed'ü'l-vahy 1; Müslim, İmâret 155","Yaptığın işlerden önce niyetini düzelt."],["Kolaylaştırınız, zorlaştırmayınız; müjdeleyiniz, nefret ettirmeyiniz.","Buhârî, İlim 11; Müslim, Cihâd 6","Bugün birine kolaylık sağla."],["Sizin en hayırlınız Kur'an'ı öğrenen ve öğretendir.","Buhârî, Fezâilü'l-Kur'ân 21","Bugün kısa da olsa bir okuma yap."],["Hiçbiriniz kendisi için istediğini kardeşi için de istemedikçe (kâmil manada) iman etmiş olmaz.","Buhârî, Îmân 7; Müslim, Îmân 71","Başkasına da kendine istediğin iyiliği iste."],["Güzel söz sadakadır.","Buhârî, Cihâd 128; Müslim, Zekât 56","Bugün birine güzel bir söz söyle."],["Temizlik imanın yarısıdır.","Müslim, Tahâret 1","Düzen ve temizlik günün için iyi bir başlangıçtır."],["Allah'a ve âhiret gününe inanan, ya hayır söylesin ya da sussun.","Buhârî, Edeb 31; Müslim, Îmân 74","Konuşmadan önce bir an düşün."],["Müslüman, dilinden ve elinden Müslümanların güvende olduğu kimsedir.","Buhârî, Îmân 4; Müslim, Îmân 64","Sözlerinle ve davranışlarınla güven ver."]];
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}S=Object.assign({tasks:[],notes:[],fav:[],pr:{},seen:{},pt:{},theme:'dark',city:'Istanbul',coords:null,tes:0,pn:{},off:0,chat:[],fired:{},name:'Ömer'},S||{});
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('Kayıt başarısız: depolama dolu/kapalı olabilir.')}};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let tab='home',selD=new Date(),pend=null,perr='';
const $=id=>document.getElementById(id);
function toast(m,id){const d=document.createElement('div');d.className='tn';d.innerHTML=esc(m)+(id?`<div class=row style="margin-top:8px"><button class="btn" onclick="this.closest('.tn').remove()">Tamam</button><button class="btn o" style="color:#111" onclick="snz(${JSON.stringify(m).replace(/"/g,'&quot;')});this.closest('.tn').remove()">10 dk ertele</button></div>`:'');$('tm').appendChild(d);if(!id)setTimeout(()=>d.remove(),3500)}
function snz(m){toast('10 dakika sonra hatırlatılacak (uygulama açıkken).');setTimeout(()=>toast(m,1),600000)}
function notify(m){toast(m,1);try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}try{if('Notification'in window&&Notification.permission==='granted')new Notification('Günüm',{body:m})}catch(e){}}
const occ=(t,d)=>t.date?t.date==ymd(d):t.days&&t.days.length?t.days.includes(d.getDay()):true;
const tasksOn=d=>S.tasks.filter(t=>occ(t,d)).sort((a,b)=>a.time.localeCompare(b.time));
const isDone=(t,d)=>!!(t.done||{})[ymd(d)];
function toggle(id,ds){const t=S.tasks.find(x=>x.id==id);t.done=t.done||{};t.done[ds]?delete t.done[ds]:t.done[ds]=1;save();render()}
function tom(id){const t=S.tasks.find(x=>x.id==id);const d=new Date();d.setDate(d.getDate()+1);if(t.date){t.date=ymd(d)}else{S.tasks.push({...t,id:Date.now(),date:ymd(d),days:[],done:{},title:t.title+' (ertelendi)'})}save();render();toast('Yarına ertelendi')}
function del(id){if(confirm('Silinsin mi?')){S.tasks=S.tasks.filter(x=>x.id!=id);save();render()}}
function pause(id){const t=S.tasks.find(x=>x.id==id);t.paused=!t.paused;save();render()}
function tri(t,d){const ds=ymd(d),dn=isDone(t,d),cf=tasksOn(d).filter(x=>x.id!=t.id&&x.time==t.time&&!x.paused).length;
return `<div class="it ${dn?'done':''}"><input type=checkbox style="width:26px;height:26px" ${dn?'checked':''} onchange="toggle(${t.id},'${ds}')"><div class=sp style="${t.paused?'opacity:.5':''}"><div class=tt>${t.imp?'⭐ ':''}${esc(t.title)}</div><div class=small>${t.time} · ${esc(t.cat)}${t.paused?' · duraklatıldı':''}${cf?' · ⚠️ çakışma':''}</div></div><button class="chip" onclick="et(${t.id})">⋯</button></div>`}
function et(id){const t=S.tasks.find(x=>x.id==id);md(`<h2>${esc(t.title)}</h2><div class=row><button class=btn onclick="cm();ft(${id})">Düzenle</button><button class="btn o" onclick="cm();pause(${id})">${t.paused?'Sürdür':'Duraklat'}</button><button class="btn o" onclick="cm();tom(${id})">Yarına ertele</button><button class="btn o" onclick="cm();del(${id})">Sil</button></div>`)}
function md(h){$('mb').innerHTML=h;$('md').style.display='flex'}function cm(){$('md').style.display='none'}
function ft(id,pre){const t=id?S.tasks.find(x=>x.id==id):Object.assign({title:'',desc:'',time:'09:00',days:[],date:'',cat:'Diğer',imp:false,msg:''},pre||{});
md(`<h2>${id?'Görevi düzenle':'Yeni görev / hatırlatıcı'}</h2><input id=a1 placeholder="Başlık" value="${esc(t.title)}"><input id=a2 placeholder="Açıklama" value="${esc(t.desc)}"><input id=a3 type=time value="${t.time}">
<select id=a4 onchange="$('dy').style.display=this.value=='w'?'flex':'none';$('a6').style.display=this.value=='o'?'block':'none'"><option value=d ${!t.date&&!t.days.length?'selected':''}>Her gün</option><option value=w ${t.days.length?'selected':''}>Haftanın seçili günleri</option><option value=o ${t.date?'selected':''}>Belirli tarih (tek sefer)</option></select>
<div class=row id=dy style="display:${t.days.length?'flex':'none'}">${[1,2,3,4,5,6,0].map(i=>`<button class="chip ${t.days.includes(i)?'on':''}" data-d=${i} onclick="this.classList.toggle('on')">${DN[i]}</button>`).join('')}</div>
<input id=a6 type=date value="${t.date||ymd(new Date())}" style="display:${t.date?'block':'none'}"><select id=a5>${CATS.map(c=>`<option ${c==t.cat?'selected':''}>${c}</option>`).join('')}</select>
<input id=a7 placeholder='Bildirim metni (örn. "${esc(S.name)}, işini unutma.")' value="${esc(t.msg)}"><label class=row><input type=checkbox id=a8 style="width:24px" ${t.imp?'checked':''}> Önemli</label>
<div class=row style="margin-top:8px"><button class="btn g" onclick="st(${id||0})">Kaydet</button><button class="btn o" onclick="cm()">Vazgeç</button></div>`)}
function st(id){const ti=$('a1').value.trim();if(!ti)return toast('Başlık gerekli.');const m=$('a4').value,days=m=='w'?[...document.querySelectorAll('#dy .on')].map(b=>+b.dataset.d):[];if(m=='w'&&!days.length)return toast('En az bir gün seç.');
const o={title:ti,desc:$('a2').value,time:$('a3').value||'09:00',days,date:m=='o'?$('a6').value:'',cat:$('a5').value,msg:$('a7').value,imp:$('a8').checked};
if(id)Object.assign(S.tasks.find(x=>x.id==id),o);else S.tasks.push({id:Date.now(),done:{},paused:false,...o});save();cm();render()}
function sh(){const l=[...Object.keys(S.seen)].sort().reverse();return l}
function hd(){const d=ymd(new Date());if(S.seen[d]==null)S.seen[d]=Math.floor(Date.now()/864e5)%H.length;save();return S.seen[d]}
function hcard(i,d){const h=H[i],f=S.fav.includes(i);return `<div class=card style="border-color:var(--g)"><div class=small>${d||'Günün hadisi'}</div><p style="font-size:18px;font-family:Georgia,serif">“${esc(h[0])}”</p><div class=small>${esc(h[1])}</div><p class=small>💡 ${esc(h[2])}</p><button class="chip ${f?'on':''}" onclick="fav(${i})">${f?'★ Favoride':'☆ Favorile'}</button></div>`}
function fav(i){S.fav=S.fav.includes(i)?S.fav.filter(x=>x!=i):[...S.fav,i];save();render()}
async function fpt(ds){const [y,m,d]=ds.split('-'),k=ds+'|'+(S.coords?S.coords.join(','):S.city),f=S.pt[k];if(f&&f.ok)return;
try{const u=S.coords?`https://api.aladhan.com/v1/timings/${d}-${m}-${y}?latitude=${S.coords[0]}&longitude=${S.coords[1]}&method=13`:`https://api.aladhan.com/v1/timingsByCity/${d}-${m}-${y}?city=${encodeURIComponent(S.city)}&country=Turkey&method=13`;
const r=await fetch(u);const j=await r.json();if(!j.data)throw 0;const o={ok:1,u:Date.now()};PK.forEach(([a])=>o[a]=j.data.timings[a].slice(0,5));S.pt[k]=o;save();perr=''}catch(e){perr='Namaz vakitleri alınamadı (internet veya servis hatası). Rastgele veri gösterilmez.'}render()}
const pt=ds=>S.pt[ds+'|'+(S.coords?S.coords.join(','):S.city)];
function nextP(){const n=new Date(),t=pt(ymd(n));if(!t)return null;const c=hm(n);for(const [k,l] of PK)if(t[k]>c){const[a,b]=t[k].split(':');const x=new Date(n);x.setHours(+a,+b,0,0);const mm=Math.round((x-n)/6e4);return{l,t:t[k],r:Math.floor(mm/60)+' sa '+mm%60+' dk'}}return{l:'İmsak (yarın)',t:'—',r:''}}
function loc(){if(!navigator.geolocation)return toast('Konum desteklenmiyor.');navigator.geolocation.getCurrentPosition(g=>{S.coords=[+g.coords.latitude.toFixed(3),+g.coords.longitude.toFixed(3)];save();fpt(ymd(new Date()))},()=>toast('Konum izni verilmedi. Şehri elle gir.'))}
function setCity(){const v=$('cty').value.trim();if(!v)return;S.city=v;S.coords=null;save();fpt(ymd(new Date()))}
function pk(ds,k){S.pr[ds]=S.pr[ds]||{};S.pr[ds][k]?delete S.pr[ds][k]:S.pr[ds][k]=1;save();render()}
function pn(k){S.pn[k]=!S.pn[k];save();render()}
function setOff(v){S.off=+v;save()}
function home(){const n=new Date(),ts=tasksOn(n).filter(t=>!t.paused),dn=ts.filter(t=>isDone(t,n)).length,nx=ts.find(t=>!isDone(t,n)&&t.time>=hm(n)),np=nextP();
return `<div class=card><div class=small style="text-align:center">Merhaba, ${esc(S.name)} 👋</div><div class=clock id=ck>${hm(n)}</div><div class=sub>${n.getDate()}.${n.getMonth()+1}.${n.getFullYear()} · ${DF[n.getDay()]}</div></div>
<div class=card><h2>Özet</h2><div class=bar><i style="width:${ts.length?dn/ts.length*100:0}%"></i></div><p class=small>${dn} tamamlandı · ${ts.length-dn} bekliyor</p><div>⏰ Sıradaki: <b>${nx?esc(nx.title)+' ('+nx.time+')':'yok'}</b></div><div>🕌 Sıradaki vakit: <b>${np?np.l+' '+np.t+' · '+np.r:'Namaz sekmesinden vakitleri yükle'}</b></div></div>
<div class=card><h2>Bugünkü program</h2>${ts.map(t=>tri(t,n)).join('')||'<p class=small>Bugün görev yok. Planlayıcıdan ekle.</p>'}<button class="btn g" style="width:100%" onclick="ft()">+ Görev ekle</button></div>${hcard(hd())}<button class="btn" style="width:100%" onclick="go('ai')">🤖 Asistana sor</button>`}
function plan(){const d=selD,ts=tasksOn(d);return `<div class=row><button class=chip onclick="selD.setDate(selD.getDate()-1);render()">‹</button><input type=date style="width:auto" class=sp value="${ymd(d)}" onchange="selD=new Date(this.value+'T12:00');render()"><button class=chip onclick="selD.setDate(selD.getDate()+1);render()">›</button></div>
<div class=row style="margin:8px 0">${[0,1,2,3,4,5,6].map(i=>{const x=new Date(d);x.setDate(d.getDate()-((d.getDay()+6)%7)+i);return `<button class="chip ${ymd(x)==ymd(d)?'on':''}" onclick="selD=new Date('${ymd(x)}T12:00');render()">${DN[x.getDay()]} ${x.getDate()}<br><span class=small>${tasksOn(x).length}</span></button>`}).join('')}</div>
<div class=card><h2>${DF[d.getDay()]} programı</h2>${ts.map(t=>tri(t,d)).join('')||'<p class=small>Bu gün için görev yok.</p>'}</div><button class="btn g" style="width:100%" onclick="ft()">+ Yeni görev / hatırlatıcı</button>
<h2 style="margin-top:14px">Gün sonu</h2><div class=card>${ts.filter(t=>isDone(t,d)).length}/${ts.length} tamamlandı. ${ts.filter(t=>!isDone(t,d)).map(t=>`<div class="it"><span class=sp>${esc(t.title)}</span><button class=chip onclick="tom(${t.id})">Yarına devret</button></div>`).join('')}</div>`}
function pray(){const n=new Date(),ds=ymd(n),t=pt(ds);let h=`<div class=card><h2>Namaz vakitleri</h2><div class=small>Kaynak: Aladhan API · Diyanet yöntemi (13)</div><div class=row><input id=cty class=sp placeholder="Şehir/ilçe (örn. Istanbul)" value="${esc(S.city)}"><button class=btn onclick="setCity()">Ara</button><button class="btn o" onclick="loc()">📍 Konumum</button></div><div class=small>${S.coords?'Konum kullanılıyor.':'Şehir: '+esc(S.city)}</div>${perr?`<p style="color:#e66">${perr}</p>`:''}`;
h+=t?PK.map(([k,l])=>`<div class=it><span class=sp>${l} <b>${t[k]}</b></span>${k!='Sunrise'?`<button class="chip ${(S.pr[ds]||{})[k]?'on':''}" onclick="pk('${ds}','${k}')">Kıldım</button>`:''}<button class="chip ${S.pn[k]?'on':''}" onclick="pn('${k}')">🔔</button></div>`).join('')+`<p class=small>Son güncelleme: ${new Date(t.u).toLocaleString('tr-TR')}</p><label class=small>Bildirim: vakitten kaç dk önce?<input type=number min=0 value=${S.off} onchange="setOff(this.value)"></label>`:'<p class=small>Vakitler henüz yüklenmedi.</p><button class="btn" onclick="fpt(ymd(new Date()))">Vakitleri yükle</button>';
h+='</div><div class=card><h2>Haftalık takip</h2><table><tr><th></th>'+PK.filter(x=>x[0]!='Sunrise').map(x=>`<th>${x[1].slice(0,3)}</th>`).join('')+'</tr>';
for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()-i);const s=ymd(d),r=S.pr[s]||{};h+=`<tr><td>${DN[d.getDay()]} ${d.getDate()}</td>`+PK.filter(x=>x[0]!='Sunrise').map(([k])=>`<td onclick="pk('${s}','${k}')">${r[k]?'✅':'▫️'}</td>`).join('')+'</tr>'}
return h+`</table></div><div class=card><h2>Tesbih</h2><div class=clock>${S.tes}</div><div class=row style="justify-content:center"><button class="btn g" style="width:140px;height:70px;font-size:24px" onclick="S.tes++;save();render()">+1</button><button class="btn o" onclick="S.tes=0;save();render()">Sıfırla</button></div></div>`}
let q='';
function notes(){const l=S.notes.filter(n=>(n.t+n.c+(n.g||'')).toLowerCase().includes(q.toLowerCase())).sort((a,b)=>(b.pin||0)-(a.pin||0)||b.id-a.id);
return `<div class=row><input class=sp placeholder="Ara…" value="${esc(q)}" oninput="q=this.value;render();this.focus()"><button class="btn g" onclick="fn()">+ Not</button></div>`+(l.map(n=>`<div class=card onclick="fn(${n.id})"><b>${n.pin?'📌 ':''}${esc(n.t||'Başlıksız')}</b><div class=small>${esc(n.g||'')}</div><div class=small>${esc((n.c||'').slice(0,100))}</div></div>`).join('')||'<p class=small>Not yok.</p>')}
function fn(id){let n=id?S.notes.find(x=>x.id==id):{id:Date.now(),t:'',c:'',g:'',pin:0};if(!id)S.notes.push(n);
md(`<h2>Not</h2><input id=n1 placeholder="Başlık" value="${esc(n.t)}" oninput="ns(${n.id})"><textarea id=n2 rows=8 oninput="ns(${n.id})" placeholder="İçerik (otomatik kaydedilir)">${esc(n.c)}</textarea><input id=n3 placeholder="Kategori/etiket" value="${esc(n.g)}" oninput="ns(${n.id})"><div class=row><button class="btn o" onclick="np(${n.id})">${n.pin?'Sabitlemeyi kaldır':'📌 Sabitle'}</button><button class="btn o" onclick="cm();ft(0,{title:$('n1')?'':'',desc:''})">⏰ Hatırlatıcı</button><button class="btn o" onclick="dn(${n.id})">Sil</button><button class=btn onclick="cn(${n.id})">Kapat</button></div>`)}
function ns(id){const n=S.notes.find(x=>x.id==id);n.t=$('n1').value;n.c=$('n2').value;n.g=$('n3').value;save()}
function np(id){const n=S.notes.find(x=>x.id==id);n.pin=n.pin?0:1;save();cm();render()}
function dn(id){if(confirm('Not silinsin mi?')){S.notes=S.notes.filter(x=>x.id!=id);save();cm();render()}}
function cn(id){const n=S.notes.find(x=>x.id==id);if(!n.t&&!n.c)S.notes=S.notes.filter(x=>x.id!=id);save();cm();render()}
function ai(){return `<div class=card><div class=small>Hatırlatıcı oluşturma ve görev listesi cihazda çalışır; serbest sohbet için Ayarlar'dan yapay zekâ adresi gerekir. “Bugün ne yapmam gerekiyor?” veya “Yarın saat 10'da kitap okumayı hatırlat” yazabilirsin.</div></div>${S.chat.map(m=>`<div class="bb ${m.r=='u'?'me':'bt'}">${esc(m.x)}</div>`).join('')}${pend?`<div class=row><button class="btn g" onclick="okp()">Onayla ve oluştur</button><button class="btn o" onclick="pend=null;render()">İptal</button></div>`:''}<div class=row style="margin-top:8px"><input id=ci class=sp placeholder="Yaz…" onkeydown="if(event.key=='Enter')snd()"><button class=btn onclick="snd()">Gönder</button></div><button class="chip" onclick="if(confirm('Sohbet silinsin mi?')){S.chat=[];save();render()}">Sohbeti sil</button>`}
async function snd(){const v=$('ci').value.trim();if(!v)return;S.chat.push({r:'u',x:v});let a;const m=v.match(/(yarın|bugün)?\s*saat\s*(\d{1,2})(?:[:.](\d{2}))?['’]?\w*\s+(.+?)\s*hatırlat/i);
if(m){const d=new Date();if((m[1]||'').toLowerCase()=='yarın')d.setDate(d.getDate()+1);const h=+m[2];if(h>23)a='Saat geçersiz görünüyor.';else{pend={title:m[4],time:p(h)+':'+p(+(m[3]||0)),date:ymd(d)};a=`Şunu oluşturayım mı? “${m[4]}” — ${pend.date} ${pend.time}`}}
else if(/bugün.*(ne|yap)/i.test(v)){const ts=tasksOn(new Date()).filter(t=>!t.paused);a=ts.length?'Bugünkü planın:\n'+ts.map(t=>`${isDone(t,new Date())?'✅':'•'} ${t.time} ${t.title}`).join('\n'):'Bugün için kayıtlı görevin yok. İstersen “yarın saat 9 da … hatırlat” yaz.'}
else if(S.aiUrl){S.chat.push({r:'b',x:'…'});save();render();const ctx=tasksOn(new Date()).map(t=>t.time+' '+t.title+(isDone(t,new Date())?' (yapıldı)':'')).join('\n');try{const r=await fetch(S.aiUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:S.chat.filter(m=>m.x!='…').slice(-10).map(m=>({role:m.r=='u'?'user':'assistant',content:m.x})),context:ctx})});const j=await r.json();if(!j.reply)throw 0;a=j.reply}catch(e){a='Yapay zekâ servisine ulaşılamadı (internet, adres veya günlük ücretsiz limit). Görevler, notlar ve namaz çalışmaya devam ediyor.'}S.chat=S.chat.filter(m=>m.x!='…')}
else a='Sohbet için Ayarlar bölümünden yapay zekâ adresini girmen gerekiyor. Şimdilik görev listeni sorabilir veya hatırlatıcı oluşturabilirsin.';S.chat.push({r:'b',x:a});save();render()}
function okp(){S.tasks.push({id:Date.now(),done:{},days:[],cat:'Diğer',desc:'',msg:'',imp:false,...pend});pend=null;S.chat.push({r:'b',x:'Oluşturuldu ✅'});save();render()}
function set(){return `<div class=card><h2>Ayarlar</h2><input value="${esc(S.name)}" onchange="S.name=this.value;save()"><div class=row><button class=btn onclick="S.theme=S.theme=='dark'?'light':'dark';save();render()">Tema: ${S.theme=='dark'?'Koyu':'Açık'}</button><button class="btn o" onclick="rq()">🔔 Bildirim izni</button></div><p class=small>Bildirimler yalnızca uygulama açıkken güvenilir çalışır. iPhone'da kapalıyken çalışan gerçek alarm için yerel uygulama gerekir.</p></div>
<div class=card><h2>Yapay zekâ</h2><input placeholder="Worker adresi (https://…workers.dev)" value="${esc(S.aiUrl||'')}" onchange="S.aiUrl=this.value.trim();save()"><p class=small>Sohbet mesajların ve bugünkü görev başlıkların bu adrese ve Cloudflare'a gönderilir. Boş bırakırsan hiçbir şey gönderilmez.</p></div><div class=card><h2>Hadis geçmişi / favoriler</h2>${sh().map(d=>`<div class=small>${d}: ${esc(H[S.seen[d]][0])}</div>`).join('')}<div class=small style="margin-top:6px">Favoriler: ${S.fav.map(i=>esc(H[i][0])).join(' • ')||'yok'}</div></div>
<div class=card><h2>Yedekle / geri yükle</h2><textarea id=bk rows=5></textarea><div class=row><button class="btn o" onclick="$('bk').value=JSON.stringify(S)">Yedeği göster (kopyala)</button><button class="btn o" onclick="try{S=Object.assign(S,JSON.parse($('bk').value));save();render();toast('Geri yüklendi')}catch(e){toast('Geçersiz yedek')}">Geri yükle</button></div><button class="btn o" style="margin-top:8px" onclick="if(confirm('Tüm veriler silinsin mi?')){localStorage.removeItem(K);location.reload()}">Tüm verileri sil</button></div>`}
async function rq(){if(!('Notification' in window))return toast('Bu tarayıcı bildirimi desteklemiyor (iPhone için önce Ana Ekrana ekle).');toast('İzin: '+await Notification.requestPermission())}
const TABS=[['home','🏠','Bugün',home],['plan','🗓️','Plan',plan],['pray','🕌','Namaz',pray],['notes','📝','Notlar',notes],['ai','🤖','Asistan',ai],['set','⚙️','Ayarlar',set]];
function go(t){tab=t;render()}

function tick(){const n=new Date(),c=hm(n),s=ymd(n),e=$('ck');if(e)e.textContent=c;
S.tasks.forEach(t=>{if(!t.paused&&occ(t,n)&&t.time==c&&!S.fired[t.id+s+c]&&!isDone(t,n)){S.fired[t.id+s+c]=1;notify(t.msg||t.title)}});
const t=pt(s);if(t)PK.forEach(([k,l])=>{if(!S.pn[k])return;const x=new Date(n);const[a,b]=t[k].split(':');x.setHours(+a,+b-S.off,0,0);if(hm(x)==c&&!S.fired[k+s]){S.fired[k+s]=1;notify(S.off?`${l} vaktine ${S.off} dk kaldı.`:`${l} vakti girdi.`)}});}
render();fpt(ymd(new Date()));setInterval(tick,10000);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
